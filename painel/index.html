<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Diego Lima</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/hub-personal-demo/css/base.css">
  <link rel="stylesheet" href="/hub-personal-demo/css/admin.css">
</head>
<body>
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <div class="shell">
    <aside class="side">
      <a class="logo" href="/"><b>HUB PERSONAL</b><span>painel</span></a>
      <span class="lab" style="padding:0 8px">Clientes</span>
      <nav class="clist" id="clist" aria-label="Clientes"></nav>
      <button class="btn sm" id="novo"><i data-lucide="plus"></i>Novo cliente</button>
      <div class="spacer"></div>
      <p class="note" style="padding:0 8px">MVP local. Sem login nesta versão; na versão real cada personal só vê a própria página.</p>
    </aside>

    <section class="main" id="main">
      <div class="mhead">
        <h1 id="ctitle">Carregando…</h1>
        <a class="linkbtn" id="openpage" target="_blank" rel="noopener"><i data-lucide="external-link"></i>Abrir página</a>
        <span class="sp"></span>
        <span class="dirty" id="dirty">Alterações não salvas</span>
        <button class="btn sm ghost" id="discard" hidden>Descartar</button>
        <button class="btn sm" id="save" disabled><i data-lucide="save"></i>Salvar e publicar</button>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="metricas" aria-selected="true"><i data-lucide="bar-chart-3"></i>Métricas</button>
        <button role="tab" data-tab="perfil" aria-selected="false"><i data-lucide="user-round"></i>Perfil e tema</button>
        <button role="tab" data-tab="blocos" aria-selected="false"><i data-lucide="layout-list"></i>Blocos</button>
        <button role="tab" data-tab="leads" aria-selected="false"><i data-lucide="users"></i>Leads</button>
        <button role="tab" data-tab="avancado" aria-selected="false"><i data-lucide="braces"></i>Avançado</button>
      </div>
      <div id="panel" class="panel" role="tabpanel"></div>
    </section>

    <aside class="preview" aria-label="Prévia no celular">
      <div class="pbar"><span>Prévia (mostra o que está salvo)</span><button class="iconbtn" id="reload" aria-label="Recarregar prévia"><i data-lucide="rotate-cw"></i></button></div>
      <div class="ph"><iframe id="frame" title="Prévia da página"></iframe></div>
    </aside>
  </div>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="/hub-personal-demo/js/data.js"></script>
  <script src="/hub-personal-demo/js/shared.js"></script>
  <script src="/hub-personal-demo/js/static-api.js"></script>
  <script src="/hub-personal-demo/js/core.js"></script>
  <script src="/hub-personal-demo/js/admin.js"></script>
</body>
</html>
